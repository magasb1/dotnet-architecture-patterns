apiVersion: v1
kind: Service
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  selector:
    app: storage-demo
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 5080
      targetPort: grpc
      # Cleartext HTTP/2. An ingress in front of this terminates TLS and forwards h2c here.
      appProtocol: kubernetes.io/h2c
---
# Reach it from the desktop client with:
#   kubectl -n storage-demo port-forward svc/storage-demo 5082:5080
# then pick "Kubernetes (port-forward)" in the client's server list.
