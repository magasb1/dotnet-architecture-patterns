# PostgreSQL under CloudNativePG.
#
# Two instances: one primary and one replica streaming from it, with the operator promoting the
# replica if the primary's node goes. That matters here because the cluster's three nodes are the
# same three nodes the application runs on, so losing one is the case being tested.
#
# The operator publishes three Services and a Secret. The application uses:
#
#   pg-rw      the current primary, which follows a failover
#   pg-app     username and password for the database created below
#
# Nobody writes a password: the operator generates one, and the Deployment composes a connection
# string from the Secret at start.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: storage-demo
spec:
  instances: 2

  storage:
    # Ceph rather than the node's own disk, so a replacement instance on another node finds its
    # data where it left it. local-path would pin each instance to one node permanently.
    storageClass: ceph-block
    size: 10Gi

  bootstrap:
    initdb:
      database: storagedemo
      owner: storagedemo

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
