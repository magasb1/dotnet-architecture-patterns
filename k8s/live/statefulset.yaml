# Apply this INSTEAD OF k8s/deployment.yaml and k8s/service.yaml, not alongside them: it defines
# the same Service name. It lives in a subdirectory so `kubectl apply -f k8s/`, which does not
# recurse, cannot pick up both by accident.
#
#   kubectl apply -f k8s/namespace.yaml -f k8s/configmap.yaml -f k8s/postgres.yaml -f k8s/redis.yaml
#   kubectl apply -f k8s/live/
#
# Live streaming needs pod identity, which is the whole reason this is a StatefulSet rather than
# the Deployment in deployment.yaml. Use one or the other:
#
#   documents only          -> deployment.yaml, replicas scale freely, no pod identity needed
#   documents plus live     -> this file, because a stream belongs to one pod and has to be
#                              reachable at that pod
#
# What makes it work:
#   * A headless Service gives every pod stable DNS, storage-demo-0.storage-demo, which is how one
#     replica proxies a viewer through to the replica actually holding the stream.
#   * Per-pod Services expose the ingest port separately per pod. Media cannot be round-robined:
#     spreading MPEG-TS datagrams across replicas gives every replica a fraction of a stream and
#     none of them a decodable one.
apiVersion: v1
kind: Service
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  # Headless: no load balancing, just per-pod DNS records.
  clusterIP: None
  selector:
    app: storage-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 5080
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  serviceName: storage-demo
  replicas: 2
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      serviceAccountName: storage-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
      containers:
        - name: api
          image: storage-demo:latest
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 5080
            - name: ingest
              containerPort: 9000
              protocol: UDP
          envFrom:
            - configMapRef:
                name: storage-demo-config
            - secretRef:
                name: storage-demo-secrets
          env:
            # The pod names itself in the shared session registry, so any replica can say which
            # one is holding a given stream.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Viewers reach a stream through the pod that owns it. The ingress routes on the pod
            # name so this address stays valid from outside the cluster.
            - name: Live__PublicBaseUrl
              value: https://storage-demo.example.com/pods/$(POD_NAME)

            # How a replica reaches a sibling, through the headless Service above.
            - name: Live__PeerAddressTemplate
              value: http://$(POD_NAME).storage-demo:8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Live recordings land here before becoming documents, so it needs room for the longest
        # stream this cluster is expected to carry.
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
# One Service per pod, each with its own ingest address. Two replicas, two Services; add one per
# replica as you scale. Tedious, and the tedium is the point: a media socket belongs to one pod,
# and pretending otherwise is what breaks the stream.
#
# k3s on a single node: type NodePort, and the sender uses node-ip:30901.
# Cilium across nodes: type LoadBalancer, one address each from an LB-IPAM pool, and
# externalTrafficPolicy Local to keep the sender's address and avoid a second hop.
apiVersion: v1
kind: Service
metadata:
  name: storage-demo-ingest-0
  namespace: storage-demo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: storage-demo-0
  ports:
    - name: ingest
      port: 9000
      targetPort: ingest
      nodePort: 30901
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: storage-demo-ingest-1
  namespace: storage-demo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: storage-demo-1
  ports:
    - name: ingest
      port: 9000
      targetPort: ingest
      nodePort: 30902
      protocol: UDP
